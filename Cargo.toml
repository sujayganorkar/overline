[workspace]
resolver = "3"
members = ["rust"]

# PdfCraft vendors patched hayro/lopdf (patches bound upstream). Patch crates.io to the fork's
# vendor/ so our build matches the engine's tested behavior exactly.
[patch.crates-io]
hayro = { path = "/home/sujay/src/pdfcraft/vendor/hayro" }
hayro-interpret = { path = "/home/sujay/src/pdfcraft/vendor/hayro-interpret" }
hayro-syntax = { path = "/home/sujay/src/pdfcraft/vendor/hayro-syntax" }
hayro-jbig2 = { path = "/home/sujay/src/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "/home/sujay/src/pdfcraft/vendor/lopdf" }

[workspace.dependencies]
flutter_rust_bridge = "2.13"
# Upstream PdfCraft engine (private fork of https://github.com/storytold/pdfcraft).
# Cloned to ~/src/pdfcraft; `origin` tracks upstream, local branches carry our patches (if any).
pdfcraft-engine = { path = "/home/sujay/src/pdfcraft/crates/engine" }
pdfcraft-render = { path = "/home/sujay/src/pdfcraft/crates/render" }

# Fast iteration for mobile builds; upstream's release profile (lto thin, codegen-units 1) is
# slow to link a cdylib this size.
[profile.release]
lto = "thin"
codegen-units = 16
