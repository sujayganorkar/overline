[workspace]
resolver = "3"
members = ["rust"]
exclude = ["third_party/pdfcraft"]

# Cargo reads patches only from the root workspace. Match the PDF engine's rendering patches.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "9eb02be84f21898e247daeb2af5827c9fe85a3a0" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "9eb02be84f21898e247daeb2af5827c9fe85a3a0" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "9eb02be84f21898e247daeb2af5827c9fe85a3a0" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "9eb02be84f21898e247daeb2af5827c9fe85a3a0" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "9eb02be84f21898e247daeb2af5827c9fe85a3a0" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "e7873217287876f76a045550369c90a541693c33" }
lopdf = { path = "third_party/pdfcraft/vendor/lopdf" }
vello_common = { path = "third_party/pdfcraft/vendor/vello_common" }
vello_cpu = { path = "third_party/pdfcraft/vendor/vello_cpu" }

[workspace.dependencies]
flutter_rust_bridge = "=2.13.0"
# Pinned PdfCraft upstream submodule; see .gitmodules and plan/decisions/.
pdfcraft-engine = { path = "third_party/pdfcraft/crates/engine" }
pdfcraft-render = { path = "third_party/pdfcraft/crates/render" }
pdfcraft-automation = { path = "third_party/pdfcraft/crates/automation", default-features = false }
serde_json = "1"

# Fast iteration for mobile builds; upstream's release profile (lto thin, codegen-units 1) is
# slow to link a cdylib this size.
[profile.release]
lto = "thin"
codegen-units = 16
